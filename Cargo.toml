[workspace]
resolver = "2"
members = [
    "examples/host_app",
    "crates/*",
    "ci",
    "cog",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Providence Salumu"]
license = "Apache-2.0"
repository = "https://github.com/smunix/calvin" # Placeholder

[workspace.dependencies]
bumpalo = "3.16"
chumsky = "1.0.0-alpha.7"
logos = "0.14"
ariadne = "0.4"
inkwell = { version = "0.5.0", features = ["llvm18-0"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
